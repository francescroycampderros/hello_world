hello.content:
  path: '/hello'
  defaults:
    _controller: '\Drupal\hello_world\Controller\HelloController::content'
    _title: 'Hello World'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'

hello.byecontent:
  path: '/bye'
  defaults:
    _controller: '\Drupal\hello_world\Controller\ByeController::content'
    _title: 'Bye World'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'